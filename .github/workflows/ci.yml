name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dietary
          POSTGRES_PASSWORD: ci-throwaway-password
          # The service creates the throwaway database the contract tests need;
          # its name must keep the `_test` suffix the test config insists on.
          POSTGRES_DB: dietary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dietary -d dietary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      JWT_SECRET: ci-only-signing-key-at-least-32-characters
      TEST_DATABASE_URL: postgresql+psycopg://dietary:ci-throwaway-password@localhost:5432/dietary_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint and format check
        run: |
          uv run ruff check app tests scripts
          uv run ruff format --check app tests scripts
      - name: Tests (default SQLite mode)
        env:
          TEST_DATABASE_URL: ""
        run: uv run pytest -q
      - name: Tests (Postgres contracts)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Expo writes typed routes into .expo/types during `expo start`, and CI never has them.
      # app/_layout.tsx reads segments through a string view so the typecheck does not depend
      # on a generated file; the export step below proves the bundle still builds.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build web bundle
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform web --output-dir /tmp/expo-export
      - name: Tests
        run: npm run test --if-present
      - name: Lint
        run: npm run lint --if-present
